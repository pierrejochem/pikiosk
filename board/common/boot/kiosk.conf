# pikiosk configuration
#
# This file lives on the FAT boot partition, so you can edit it from any
# computer by putting the SD card in a card reader. Changes apply on the
# next boot. Format: KEY=value, one per line; lines starting with # are
# ignored. Quotes around values are optional.

# --- System -------------------------------------------------------------
HOSTNAME=kiosk
# Any name from the tz database, e.g. Europe/Berlin, America/New_York
TIMEZONE=Europe/Berlin
# Optional; space-separated. Empty = systemd's default pool.
NTP_SERVERS=

# --- WiFi (leave WIFI_SSID empty for Ethernet only) ------------------------
WIFI_COUNTRY=DE
WIFI_SSID=
# WPA2/WPA3 passphrase (8-63 chars) or 64 hex digits. Empty = open network.
WIFI_PSK=
# yes if the network does not broadcast its SSID
WIFI_HIDDEN=no

# --- Addressing ------------------------------------------------------------
# dhcp on both eth0 and wlan0 (Ethernet preferred when both are up),
# or static for the interface named in STATIC_IFACE.
NETWORK=dhcp
STATIC_IFACE=eth0
STATIC_ADDRESS=192.168.1.50/24
STATIC_GATEWAY=192.168.1.1
STATIC_DNS=192.168.1.1 1.1.1.1

# --- Kiosk application -----------------------------------------------------
# Absolute path to the program started fullscreen at boot. It runs as the
# unprivileged "kiosk" account, is restarted if it exits, and the board
# reboots if it crashes 5 times within 2 minutes.
# The default is kiosk-ui, the built-in Rust/egui app with liquid-glass UI.
# Tip: put your own app under /data/app (writable, survives reboots) and
# update it with scp, no re-flashing needed.
APP=/usr/bin/kiosk-ui
APP_ARGS=
# Extra environment, space-separated KEY=value pairs, e.g. for Qt:
# APP_ENV=QT_QPA_PLATFORM=eglfs QT_QPA_EGLFS_HIDECURSOR=1
APP_ENV=

# --- kiosk-ui display ---------------------------------------------------------
# Frame rate cap while animating (default 30; the Pi 3B GPU runs warm at 60)
UI_FPS=
# UI scale; empty = automatic (1.0 on the 800x480 panel and at 720p, 1.5 at 1080p)
UI_SCALE=
# Screen mode, e.g. 1280x720; empty = the display's preferred mode
UI_MODE=
# Which display to use when both are connected: dsi (default) or hdmi.
# With only the HDMI panel connected kiosk-ui uses HDMI automatically.
UI_OUTPUT=
# Wallpaper photo: copy a file named wallpaper.jpg (or .png) next to this
# file, then choose "Photo" on the Controls page.

# --- Apps ----------------------------------------------------------------------
# While an app from the store runs, holding a finger in the top-right corner
# of the screen for 3 seconds returns to kiosk-ui. no turns this off.
KIOSK_HOME_GESTURE=yes
