[package]
name = "kiosk-kit"
description = "Display, touch and glass widgets for pikiosk apps (DRM/KMS, GLES2, egui)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui_glow = { version = "0.37", default-features = false }
glow = { version = "0.17", default-features = false }
log = "0.4.34"

[target.'cfg(target_os = "linux")'.dependencies]
drm = "0.14"
gbm = { version = "0.18", default-features = false, features = ["drm-support"] }
input = "0.10"
khronos-egl = { version = "6", features = ["dynamic"] }
libc = "0.2"
