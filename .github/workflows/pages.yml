# Publishes site/ (the project page) and media/ (logos, served at /media/) with GitHub Pages whenever it changes on master.
# The signed app store has its own site, in the pikiosk-apps repository.
name: Pages

on:
  push:
    branches: [master]
    paths: ["site/**", "media/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r site/. _site/
          cp -r media _site/media
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
