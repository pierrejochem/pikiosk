[package]
name = "kiosk-ui"
version = "0.1.0"
edition = "2024"
description = "Fullscreen egui kiosk app with liquid-glass widgets (DRM/KMS, GLES2)"
license = "MIT"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"], optional = true }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui_glow = { version = "0.37", default-features = false }
env_logger = "0.11.11"
glow = { version = "0.17", default-features = false }
if-addrs = "0.15.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
log = "0.4.34"

[target.'cfg(target_os = "linux")'.dependencies]
drm = "0.14"
gbm = { version = "0.18", default-features = false, features = ["drm-support"] }
input = "0.10"
khronos-egl = { version = "6", features = ["dynamic"] }

[features]
desktop = ["dep:eframe"]

[profile.release]
lto = "thin"
strip = true
panic = "abort"
