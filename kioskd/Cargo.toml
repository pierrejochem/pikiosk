[package]
name = "kioskd"
description = "Root daemon of the pikiosk app store: launches apps, brings kiosk-ui back"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
kpkg = { path = "../kpkg" }
anyhow = "1.0.104"
env_logger = "0.11.11"
libc = "0.2"
log = "0.4.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
